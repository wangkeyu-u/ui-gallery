name = "inner-atlas"
main = "worker.mjs"
compatibility_date = "2026-11-16"
workers_dev = true
preview_urls = false

[build]
command = "node build.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
PUBLIC_ANALYSIS = "true"
DEEPSEEK_REVIEW = "false"

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
